name: Fuzz

on:
  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  fuzz:
    name: Fuzz (5 minutes)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig 0.15.2
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Run fuzz harnesses
        run: zig build fuzz --fuzz
        timeout-minutes: 5
