name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig 0.15.2
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Run tests
        run: zig build test

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # musl on Linux -> fully static binaries with no libc dependency.
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - aarch64-windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig 0.15.2
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Cross-compile
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          case "${{ matrix.target }}" in
            *windows*)
              zip -qj "dist/jsz-${VERSION}-${{ matrix.target }}.zip" zig-out/bin/jsz.exe
              ;;
            *)
              tar -czf "dist/jsz-${VERSION}-${{ matrix.target }}.tar.gz" -C zig-out/bin jsz
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: jsz-${{ matrix.target }}
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum ./* > SHA256SUMS.txt && ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "jsz $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
