name: Fuzz

on:
  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # Deterministic smoke run: executes every fuzz harness body once (no
  # coverage-guided mutation). This is the gate that must stay green.
  fuzz-smoke:
    name: Fuzz harnesses (smoke)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig 0.15.2
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Run fuzz harnesses once
        run: zig build fuzz
        timeout-minutes: 10

  # Coverage-guided fuzzing ('zig build fuzz --fuzz') is intentionally NOT run
  # in CI: Zig 0.15's experimental in-process fuzzer panics deterministically
  # in std.Build.Fuzz.addEntryPoint ("start index 1 is larger than end index
  # 0") before fuzzing starts, on every run. Re-add a guided job when the
  # upstream fuzzer stabilizes; until then run it locally if needed.
