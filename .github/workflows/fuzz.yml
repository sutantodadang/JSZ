name: Fuzz

on:
  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # Deterministic smoke run: executes every fuzz harness body once (no
  # coverage-guided mutation). This is the gate that must stay green.
  fuzz-smoke:
    name: Fuzz harnesses (smoke)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig 0.15.2
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Run fuzz harnesses once
        run: zig build fuzz
        timeout-minutes: 10

  # Coverage-guided fuzzing (manual only). Zig 0.15's in-process fuzzer is
  # experimental and currently panics in std.Build.Fuzz.addEntryPoint
  # ("start index 1 is larger than end index 0") before fuzzing starts;
  # it also never terminates on its own, so a wall-clock timeout counts as
  # success here. Re-evaluate when the upstream fuzzer stabilizes.
  fuzz-guided:
    name: Fuzz (coverage-guided, best effort)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig 0.15.2
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Fuzz for 4 minutes
        run: |
          set +e
          timeout --preserve-status 240 zig build fuzz --fuzz
          code=$?
          # 124/143 = killed by timeout after fuzzing ran: success.
          if [ "$code" = "124" ] || [ "$code" = "143" ] || [ "$code" = "0" ]; then
            exit 0
          fi
          exit "$code"
