name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.optimize }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        optimize: [Debug, ReleaseSafe]
        include:
          # ReleaseFast is not what we ship (releases are ReleaseSafe), but it
          # strips all safety checks — one leg catches optimize-only UB cheaply.
          - os: ubuntu-latest
            optimize: ReleaseFast

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Zig 0.15.2
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Test
        run: zig build test -Doptimize=${{ matrix.optimize }}

      - name: GC stress (W4 hard gate — bounded heap under sustained allocation)
        run: zig build gc-stress -Doptimize=${{ matrix.optimize }}

      - name: Differential vs Node.js (bc engine of record)
        if: matrix.os == 'ubuntu-latest'
        run: zig build differential -Doptimize=${{ matrix.optimize }}

      - name: Embedding example compiles + runs
        run: zig build example-embed -Doptimize=${{ matrix.optimize }}

      - name: C ABI example compiles + runs (examples/embed.c via libjsz)
        run: zig build example-capi -Doptimize=${{ matrix.optimize }}

      - name: Conformance delta (known-failing flip gate)
        if: matrix.os == 'ubuntu-latest' && matrix.optimize == 'Debug'
        run: zig build conformance-delta -Doptimize=${{ matrix.optimize }}

  # Valgrind memcheck: Zig's Debug builds emit valgrind client requests, and
  # Zig safety checks do NOT catch use-after-free / uninitialized reads inside
  # the custom GC heap — memcheck does. Runs the jsz CLI over the differential
  # corpus plus a GC-churn script. JS-level failures (nonzero jsz exit) are
  # ignored here; only memcheck errors (exit 99) fail the job.
  memcheck:
    name: valgrind memcheck (ubuntu / Debug)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Zig 0.15.2
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build (Debug, baseline CPU — valgrind lacks AVX-512 decode)
        run: zig build -Dcpu=baseline

      - name: Memcheck over differential corpus + GC churn
        run: |
          set -u
          fail=0
          run_one() {
            local code=0
            valgrind --quiet --error-exitcode=99 --leak-check=no \
              ./zig-out/bin/jsz "$1" >/dev/null 2>vg.err || code=$?
            # 0 = ok, 1 = uncaught JS exception (expected for some corpus
            # files). 99 = memcheck errors. >=128 = crash signal. Anything
            # other than 0/1 fails the job and dumps diagnostics.
            if [ "$code" != "0" ] && [ "$code" != "1" ]; then
              echo "MEMCHECK/CRASH FAIL (exit $code): $1"
              cat vg.err
              fail=1
            fi
          }
          for f in tests/diff_corpus/*.js; do
            run_one "$f"
          done
          run_one tests/valgrind_gc_churn.js
          exit "$fail"
